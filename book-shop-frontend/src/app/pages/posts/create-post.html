<div class="post-form">
  <h2>{{ editing ? 'Chỉnh sửa bài viết' : 'Tạo bài viết mới' }}</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label>Tiêu đề</label>
      <input pInputText formControlName="title" [ngClass]="{invalid: form.get('title')?.invalid && form.get('title')?.touched}" />
      <small class="error" *ngIf="form.get('title')?.invalid && form.get('title')?.touched">Tiêu đề không được để trống</small>
    </div>
    <div class="field">
      <label>Nội dung</label>
      <textarea formControlName="content" rows="6"></textarea>
    </div>
    <div class="field">
      <label>Ảnh bài viết</label>
      <div class="image-source-options">
        <label>
          <input type="radio" name="imageSource" value="file" [checked]="imageSource === 'file'" (change)="setImageSource('file')" />
          Tải ảnh từ máy
        </label>
        <label>
          <input type="radio" name="imageSource" value="url" [checked]="imageSource === 'url'" (change)="setImageSource('url')" />
          Gắn link ảnh
        </label>
      </div>
      <div *ngIf="imageSource === 'file'" class="file-input">
        <input type="file" (change)="onFileChange($event)" accept="image/*" />
      </div>
      <div *ngIf="imageSource === 'url'" class="url-input">
        <input pInputText type="url" name="imageUrl" placeholder="Nhập URL ảnh" [(ngModel)]="imageUrl" [ngModelOptions]="{standalone: true}" (input)="onImageUrlInput()" />
      </div>
      <div class="image-preview" *ngIf="imagePreview">
        <img [src]="imagePreview" alt="Preview ảnh bài viết" />
      </div>
    </div>
    <div class="field">
      <label>Đính kèm sách</label>
      <p-multiSelect [options]="books" optionLabel="title" optionValue="id" formControlName="book_ids"></p-multiSelect>
    </div>
    <div class="actions">
      <button pButton type="submit" [label]="editing ? 'Cập nhật và gửi lại' : 'Gửi lên duyệt'"></button>
    </div>
    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
  </form>
</div>
