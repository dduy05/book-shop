<div class="mine-posts">
  <h2>Bài viết của tôi</h2>
  <div class="table-header">
    <a class="primary-button" [routerLink]="['/posts/create']">Tạo bài mới</a>
  </div>

  <p-table [value]="posts()">
    <ng-template pTemplate="header">
      <tr><th>ID</th><th>Tiêu đề</th><th>Trạng thái</th><th>Lý do từ chối</th><th>Hành động</th></tr>
    </ng-template>
    <ng-template pTemplate="body" let-post>
      <tr>
        <td>{{post.id}}</td>
        <td>{{post.title}}</td>
        <td>{{post.status}}</td>
        <td>{{post.rejection_reason || '-'}}</td>
        <td class="action-cell">
          <button pButton type="button" label="Xem" [routerLink]="['/posts', post.id]"></button>
          <button pButton type="button" label="Sửa" class="p-button-warning" (click)="onEdit(post)" [disabled]="post.status === 'approved'"></button>
          <button pButton type="button" label="Xóa" class="p-button-danger" (click)="onDelete(post)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>

</div>
